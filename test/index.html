<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PageGrab</title>
  <script src="pagegrab.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
      background: #1a1a1a;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- Toolbar ---- */
    .toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #252525;
      border-bottom: 1px solid #333;
    }
    .toolbar-title { color: #569cd6; font-weight: bold; font-size: 13px; white-space: nowrap; }
    .toolbar input[type=text] {
      flex: 1;
      padding: 5px 10px;
      background: #2d2d2d;
      border: 1px solid #3c3c3c;
      border-radius: 3px;
      color: #d4d4d4;
      font-family: inherit;
      font-size: 12px;
      min-width: 0;
    }
    .toolbar input[type=text]:focus { outline: none; border-color: #569cd6; }

    button {
      padding: 5px 12px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-primary   { background: #0e639c; color: #fff; }
    .btn-primary:hover  { background: #1177bb; }
    .btn-secondary { background: #3c3c3c; color: #ccc; }
    .btn-secondary:hover { background: #4a4a4a; }
    .btn-run       { background: #1a6b3c; color: #9cdcfe; }
    .btn-run:hover { background: #1e8048; }

    /* ---- Sessions ---- */
    .sessions {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #1e1e1e;
      border-bottom: 1px solid #2d2d2d;
      min-height: 32px;
      flex-wrap: wrap;
    }
    .sessions-label { color: #6a6a6a; font-size: 11px; }
    .session-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      background: #1e3a5f;
      border: 1px solid #264f78;
      border-radius: 10px;
      color: #9cdcfe;
      font-size: 11px;
    }
    .session-chip-close {
      padding: 0 2px;
      background: none;
      border: none;
      color: #6a6a6a;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
    }
    .session-chip-close:hover { color: #f48771; }

    /* ---- 主体：上下分栏 ---- */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ---- 请求日志 ---- */
    .log-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .log-cols {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 52px 54px minmax(0,1fr) 52px 140px 72px;
      padding: 4px 14px;
      background: #252525;
      border-bottom: 1px solid #333;
      color: #6a6a6a;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .log { flex: 1; overflow-y: auto; }
    .log-empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
    }

    .entry { border-bottom: 1px solid #252525; }
    .entry-row {
      display: grid;
      grid-template-columns: 52px 54px minmax(0,1fr) 52px 140px 72px;
      padding: 4px 14px;
      cursor: pointer;
      align-items: center;
    }
    .entry-row:hover { background: #2a2a2a; }
    .entry.pending .entry-row { opacity: 0.55; }
    .entry-detail {
      display: none;
      padding: 10px 14px 14px;
      background: #1e2a38;
      border-top: 1px solid #1e3a5f;
    }
    .entry.expanded .entry-detail { display: block; }

    /* Cell */
    .c-tab  { color: #6a6a6a; }
    .c-method { font-weight: bold; }
    .m-GET    { color: #4ec9b0; }
    .m-POST   { color: #ce9178; }
    .m-PUT    { color: #569cd6; }
    .m-DELETE { color: #f48771; }
    .m-other  { color: #c586c0; }
    .c-url  { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d4d4d4; padding: 0 8px; }
    .s-2    { color: #4ec9b0; }
    .s-3    { color: #dcdcaa; }
    .s-4    { color: #f48771; }
    .s-5    { color: #f48771; }
    .s-err  { color: #f48771; font-style: italic; }
    .s-null { color: #555; }
    .c-mime { color: #6a6a6a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
    .c-time { color: #6a6a6a; text-align: right; }

    /* Detail */
    .detail-block { margin-bottom: 10px; }
    .detail-block:last-child { margin-bottom: 0; }
    .detail-key { color: #6a9fb5; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .detail-url { color: #9cdcfe; word-break: break-all; }
    .detail-pre {
      background: #111;
      border: 1px solid #2d2d2d;
      border-radius: 2px;
      padding: 6px 10px;
      font-size: 11px;
      color: #ce9178;
      max-height: 200px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .detail-null { color: #444; font-style: italic; }

    /* ---- 执行控制台 ---- */
    .console-wrap {
      flex-shrink: 0;
      border-top: 2px solid #333;
      background: #1e1e1e;
    }
    .console-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #252525;
      border-bottom: 1px solid #333;
      cursor: pointer;
      user-select: none;
    }
    .console-header-title { color: #dcdcaa; font-size: 11px; font-weight: bold; flex: 1; }
    .console-toggle { color: #666; font-size: 10px; }
    .console-body {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .console-wrap.collapsed .console-body { display: none; }
    .console-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .console-label { color: #6a6a6a; font-size: 11px; white-space: nowrap; }
    select {
      padding: 4px 8px;
      background: #2d2d2d;
      border: 1px solid #3c3c3c;
      border-radius: 3px;
      color: #d4d4d4;
      font-family: inherit;
      font-size: 12px;
    }
    select:focus { outline: none; border-color: #569cd6; }
    textarea {
      width: 100%;
      padding: 6px 10px;
      background: #111;
      border: 1px solid #3c3c3c;
      border-radius: 3px;
      color: #ce9178;
      font-family: inherit;
      font-size: 12px;
      resize: vertical;
      min-height: 52px;
    }
    textarea:focus { outline: none; border-color: #569cd6; }
    .console-output {
      background: #111;
      border: 1px solid #2d2d2d;
      border-radius: 3px;
      padding: 6px 10px;
      font-size: 11px;
      color: #4ec9b0;
      max-height: 120px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 28px;
    }
    .console-output.err { color: #f48771; }
    .console-output.empty { color: #444; font-style: italic; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #3c3c3c; border-radius: 3px; }

    /* Status bar */
    .statusbar {
      flex-shrink: 0;
      padding: 3px 14px;
      background: #007acc;
      color: rgba(255,255,255,0.85);
      font-size: 11px;
    }
    .statusbar.warn  { background: #b5770d; }
    .statusbar.error { background: #8b2020; }
    .statusbar.idle  { background: #3c3c3c; }

    /* Install hint */
    .install-hint {
      padding: 8px 14px;
      background: #2d2d00;
      border-bottom: 1px solid #555500;
      color: #dcdcaa;
      font-size: 11px;
      line-height: 1.6;
    }
    .install-hint b { color: #fff; }
    .install-hint.hidden { display: none; }
  </style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-title">PageGrab</span>
  <input type="text" id="url-input" placeholder="输入目标页面 URL..." value="https://httpbin.org/anything" />
  <button class="btn-primary" onclick="openTab()">打开采集</button>
  <button class="btn-secondary" onclick="clearLog()">清空</button>
  <button class="btn-secondary" onclick="exportJson()">导出 JSON</button>
</div>

<div class="install-hint" id="install-hint">
  <b>安装说明：</b>
  chrome://extensions → 开启「开发者模式」→「加载已解压的扩展程序」→ 选 <b>extension/</b> 目录，安装后刷新。
  本页面需通过 HTTP 访问（不支持 file://），可用 <b>npx serve .</b> 或 <b>python3 -m http.server 8080</b> 启动。
</div>

<div class="sessions" id="sessions">
  <span class="sessions-label">采集中：</span>
  <span id="sessions-empty" style="color:#444">暂无</span>
</div>

<div class="main">
  <div class="log-wrap">
    <div class="log-cols">
      <span>Tab</span>
      <span>Method</span>
      <span style="padding:0 8px">URL</span>
      <span>Status</span>
      <span style="padding:0 4px">Type</span>
      <span style="text-align:right">Time</span>
    </div>
    <div class="log" id="log">
      <div class="log-empty">等待请求...</div>
    </div>
  </div>

  <!-- 执行控制台 -->
  <div class="console-wrap" id="console-wrap">
    <div class="console-header" onclick="toggleConsole()">
      <span class="console-header-title">执行控制台</span>
      <span class="console-toggle" id="console-toggle">▲</span>
    </div>
    <div class="console-body">
      <div class="console-row">
        <span class="console-label">Tab</span>
        <select id="exec-tab"><option value="">选择 Tab</option></select>
        <span class="console-label">预设</span>
        <select id="exec-preset" onchange="applyPreset(this.value)">
          <option value="">自定义</option>
          <option value="html">获取渲染后 HTML</option>
          <option value="title">获取页面标题</option>
          <option value="links">获取所有链接</option>
          <option value="images">获取所有图片 src</option>
          <option value="qs">querySelector</option>
          <option value="qsa">querySelectorAll</option>
        </select>
        <input type="text" id="exec-selector" placeholder="CSS 选择器" style="display:none;width:180px" />
        <select id="exec-prop" style="display:none">
          <option value="outerHTML">outerHTML</option>
          <option value="textContent">textContent</option>
          <option value="innerHTML">innerHTML</option>
          <option value="value">value</option>
          <option value="src">src</option>
          <option value="href">href</option>
        </select>
        <button class="btn-run" onclick="runExecute()">执行</button>
      </div>
      <textarea id="exec-expr" placeholder="输入 JS 表达式，结果需可 JSON 序列化&#10;示例：document.title&#10;示例：[...document.querySelectorAll('h1')].map(el => el.textContent)"></textarea>
      <div class="console-output empty" id="exec-output">结果将显示在这里</div>
    </div>
  </div>
</div>

<div class="statusbar idle" id="statusbar">插件未连接，请确认已安装扩展并通过 HTTP 服务访问本页</div>

<script>
  let pi = null

  const allEntries     = []
  const activeSessions = {}
  const pendingRows    = new Map()

  // 页面加载后自动检测插件
  PageGrab.init({
    minVersion: '1.0.0',
    downloadUrl: '',   // 留空则不显示下载按钮，填入实际地址即可
  }).then((instance) => {
    if (!instance) return  // 未安装或版本过低，已弹提示
    pi = instance
    hideInstallHint()
    setStatus('插件已连接，就绪')
    pi
      .on('request', ({ tabId, data }) => onRequest(tabId, data))
      .on('response', ({ tabId, data }) => onResponse(tabId, data))
      .on('tab_closed', ({ tabId }) => {
        delete activeSessions[tabId]
        renderSessions()
        setStatus(`Tab #${tabId} 已关闭`, 'idle')
      })
      .on('error', ({ error }) => setStatus(`错误: ${error}`, 'error'))
      .on('disconnected', () => setStatus('与插件的连接已断开，请刷新页面', 'warn'))
  })

  // ---- Tab 操作 ----

  async function openTab() {
    if (!pi) return setStatus('插件未就绪，请先安装扩展并刷新页面', 'warn')
    const url = document.getElementById('url-input').value.trim()
    if (!url) return alert('请输入 URL')
    if (!/^https?:\/\//.test(url)) return alert('URL 需以 http:// 或 https:// 开头')
    setStatus(`正在打开 ${url}...`)
    try {
      const tabId = await pi.openTab(url)
      activeSessions[tabId] = url
      renderSessions()
      setStatus(`Tab #${tabId} 已打开，正在采集...`)
      hideInstallHint()
    } catch (err) {
      setStatus(`打开失败: ${err.message}`, 'error')
    }
  }

  function closeTab(tabId) {
    pi.closeTab(tabId)
    delete activeSessions[tabId]
    renderSessions()
  }

  // ---- Sessions ----

  function renderSessions() {
    const wrap = document.getElementById('sessions')
    wrap.querySelectorAll('.session-chip').forEach(el => el.remove())
    const empty = document.getElementById('sessions-empty')
    const ids = Object.keys(activeSessions)

    // 同步更新执行控制台的 Tab 下拉框
    const sel = document.getElementById('exec-tab')
    const cur = sel.value
    sel.innerHTML = '<option value="">选择 Tab</option>'

    if (ids.length === 0) {
      if (empty) empty.style.display = ''
    } else {
      if (empty) empty.style.display = 'none'
      ids.forEach(tabId => {
        const url = activeSessions[tabId] || ''
        const label = url.replace(/^https?:\/\//, '').substring(0, 50)
        const chip = document.createElement('span')
        chip.className = 'session-chip'
        chip.innerHTML = `#${tabId} ${esc(label)}<button class="session-chip-close" onclick="closeTab(${tabId})" title="关闭">×</button>`
        wrap.appendChild(chip)

        const opt = document.createElement('option')
        opt.value = tabId
        opt.textContent = `#${tabId} ${label}`
        sel.appendChild(opt)
      })
      if (cur && activeSessions[cur]) sel.value = cur
      else sel.value = ids[0]
    }
  }

  // ---- 请求日志 ----

  function onRequest(tabId, data) {
    const key = `${tabId}:${data.requestId}`
    const el = createRow(tabId, data, true)
    pendingRows.set(key, el)
    appendRow(el)
  }

  function onResponse(tabId, data) {
    const key = `${tabId}:${data.requestId}`
    const existing = pendingRows.get(key)
    if (existing) {
      updateRow(existing, tabId, data)
      existing.classList.remove('pending')
      pendingRows.delete(key)
    } else {
      appendRow(createRow(tabId, data, false))
    }
    allEntries.push({ tabId, ...data })
  }

  function appendRow(el) {
    const log = document.getElementById('log')
    const empty = log.querySelector('.log-empty')
    if (empty) empty.remove()
    log.appendChild(el)
    log.scrollTop = log.scrollHeight
  }

  function createRow(tabId, data, isPending) {
    const el = document.createElement('div')
    el.className = 'entry' + (isPending ? ' pending' : '')
    el.innerHTML = rowHTML(tabId, data) + `<div class="entry-detail">${detailContent(data)}</div>`
    el.querySelector('.entry-row').addEventListener('click', () => el.classList.toggle('expanded'))
    return el
  }

  function updateRow(el, tabId, data) {
    const oldRow = el.querySelector('.entry-row')
    oldRow.outerHTML = rowHTML(tabId, data)
    el.querySelector('.entry-detail').innerHTML = detailContent(data)
    el.querySelector('.entry-row').addEventListener('click', () => el.classList.toggle('expanded'))
  }

  function rowHTML(tabId, data) {
    const method = data.method || '—'
    const methodClass = { GET: 'm-GET', POST: 'm-POST', PUT: 'm-PUT', DELETE: 'm-DELETE' }[method] || 'm-other'

    let statusClass = 's-null', statusText = '—'
    if (data.errorText)    { statusClass = 's-err'; statusText = 'ERR' }
    else if (data.status != null) { statusClass = `s-${Math.floor(data.status / 100)}`; statusText = data.status }

    const mime = (data.mimeType || '').replace(/;.*/, '') || '—'
    const time = data.timestamp
      ? new Date(data.timestamp * 1000).toLocaleTimeString('zh-CN', { hour12: false })
      : '—'

    return `<div class="entry-row">
      <span class="c-tab">#${tabId}</span>
      <span class="c-method ${methodClass}">${method}</span>
      <span class="c-url" title="${esc(data.url)}">${esc(data.url)}</span>
      <span class="${statusClass}">${statusText}</span>
      <span class="c-mime" title="${esc(mime)}">${esc(mime)}</span>
      <span class="c-time">${time}</span>
    </div>`
  }

  function detailContent(data) {
    const block = (label, content) =>
      `<div class="detail-block"><div class="detail-key">${label}</div>${content}</div>`

    const pre = (val) => {
      if (val == null) return '<div class="detail-null">—</div>'
      let str = typeof val === 'string' ? val : JSON.stringify(val, null, 2)
      try { str = JSON.stringify(JSON.parse(str), null, 2) } catch (_) {}
      return `<pre class="detail-pre">${esc(str)}</pre>`
    }

    return [
      block('URL', `<div class="detail-url">${esc(data.url || '')}</div>`),
      data.requestBody != null   ? block('Request Body',    pre(data.requestBody))    : '',
      block('Request Headers',  pre(data.requestHeaders)),
      data.responseHeaders       ? block('Response Headers', pre(data.responseHeaders)) : '',
      data.status != null        ? block(`Response Body${data.responseBody == null ? ' (未获取)' : ''}`, pre(data.responseBody)) : '',
      data.errorText             ? block('Error', `<div class="detail-null">${esc(data.errorText)}</div>`) : '',
    ].join('')
  }

  // ---- 执行控制台 ----

  const PRESETS = {
    html:   `document.documentElement.outerHTML`,
    title:  `document.title`,
    links:  `[...document.querySelectorAll('a')].map(a => a.href)`,
    images: `[...document.querySelectorAll('img')].map(img => img.src)`,
  }

  function applyPreset(val) {
    const expr     = document.getElementById('exec-expr')
    const selInput = document.getElementById('exec-selector')
    const propSel  = document.getElementById('exec-prop')

    const needsSelector = val === 'qs' || val === 'qsa'
    selInput.style.display = needsSelector ? '' : 'none'
    propSel.style.display  = needsSelector ? '' : 'none'

    if (PRESETS[val]) {
      expr.value = PRESETS[val]
    } else if (needsSelector) {
      updateSelectorExpr(val)
    } else {
      expr.value = ''
    }
  }

  function updateSelectorExpr(preset) {
    const sel  = document.getElementById('exec-selector').value || '.selector'
    const prop = document.getElementById('exec-prop').value
    const expr = document.getElementById('exec-expr')
    if (preset === 'qs') {
      expr.value = `(el => el ? el.${prop} : null)(document.querySelector(${JSON.stringify(sel)}))`
    } else if (preset === 'qsa') {
      expr.value = `[...document.querySelectorAll(${JSON.stringify(sel)})].map(el => el.${prop})`
    }
  }

  // 选择器或属性变化时自动更新表达式
  document.getElementById('exec-selector').addEventListener('input', () => {
    const preset = document.getElementById('exec-preset').value
    if (preset === 'qs' || preset === 'qsa') updateSelectorExpr(preset)
  })
  document.getElementById('exec-prop').addEventListener('change', () => {
    const preset = document.getElementById('exec-preset').value
    if (preset === 'qs' || preset === 'qsa') updateSelectorExpr(preset)
  })

  async function runExecute() {
    if (!pi) return showOutput('插件未就绪', true)
    const tabId = parseInt(document.getElementById('exec-tab').value)
    const expr  = document.getElementById('exec-expr').value.trim()
    const out   = document.getElementById('exec-output')

    if (!tabId) return showOutput('请先选择一个 Tab', true)
    if (!expr)  return showOutput('请输入 JS 表达式', true)

    showOutput('执行中...', false, true)
    try {
      const result = await pi.execute(tabId, expr)
      const text = typeof result === 'string' ? result : JSON.stringify(result, null, 2)
      showOutput(text, false)
    } catch (err) {
      showOutput(err.message, true)
    }
  }

  function showOutput(text, isErr = false, isEmpty = false) {
    const out = document.getElementById('exec-output')
    out.textContent = text
    out.className = 'console-output' + (isErr ? ' err' : isEmpty ? ' empty' : '')
  }

  function toggleConsole() {
    const wrap = document.getElementById('console-wrap')
    const toggle = document.getElementById('console-toggle')
    wrap.classList.toggle('collapsed')
    toggle.textContent = wrap.classList.contains('collapsed') ? '▼' : '▲'
  }

  // ---- 工具 ----

  function clearLog() {
    allEntries.length = 0
    pendingRows.clear()
    document.getElementById('log').innerHTML = '<div class="log-empty">等待请求...</div>'
  }

  function exportJson() {
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob([JSON.stringify(allEntries, null, 2)], { type: 'application/json' })),
      download: `intercept-${Date.now()}.json`
    })
    a.click()
  }

  function setStatus(text, level = 'ok') {
    const bar = document.getElementById('statusbar')
    bar.textContent = text
    bar.className = 'statusbar' + (level !== 'ok' ? ` ${level}` : '')
  }

  function hideInstallHint() {
    document.getElementById('install-hint').classList.add('hidden')
    if (document.getElementById('statusbar').classList.contains('idle')) {
      setStatus('插件已连接')
    }
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }

  // 键盘快捷键：Ctrl+Enter 执行
  document.getElementById('exec-expr').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) runExecute()
  })
</script>
</body>
</html>
